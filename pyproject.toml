[project]
name = "islands"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "scipy>=1.17.1",
]

[project.scripts]
islands = "islands.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
